# Parity suite against the Next.js app (story 0.9) and the Laravel portal (story 1.4).
# ADR-028 asks for a next/laravel matrix; they are two jobs instead, because the steps differ completely
# (Next: apps/web unit tests, the parity infra stack, next dev; Laravel: the portal's own compose stack via
# scripts/laravel-stack.mjs). The `laravel` job runs every gate in tests/parity/converted-tags.txt, plus
# the tests of not-yet-converted gates that already apply (`--only`).
# Laravel's own CI (Pint, Larastan, Pest, audits, log grep) is in portal.yml.
name: parity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  next:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: apps/web dependencies and unit tests
        working-directory: apps/web
        run: |
          npm ci
          npx prisma generate
          npm run typecheck
          npm run test
      - name: parity suite dependencies
        working-directory: tests/parity
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: structure and coverage
        working-directory: tests/parity
        run: |
          npm run check
          npm run selftest
          npm run coverage
      - name: test stack
        working-directory: tests/parity
        run: |
          npm run infra:up
          npm run infra:probe
      - name: parity suite on Next (all but disruptive)
        working-directory: tests/parity
        run: node scripts/next-stack.mjs -- --grep-invert "@disruptive|@stripe-live-test"
      - name: parity suite on Next (disruptive, serial)
        working-directory: tests/parity
        run: node scripts/next-stack.mjs "@disruptive" -- --workers=1
      - name: stack logs on failure
        if: failure()
        working-directory: tests/parity
        run: docker compose -f infra/docker-compose.test.yml logs --no-color | tail -500
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/parity/playwright-report

  laravel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: runner user for the portal bind mount
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
      - name: parity suite dependencies
        working-directory: tests/parity
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: converted gates on Laravel (converted-tags.txt)
        working-directory: tests/parity
        run: node scripts/laravel-stack.mjs
      # Story 1.4 (X-01): every guarded mutation x every refused Origin/Referer variant. Drop this step once
      # `@security&@api` is in converted-tags.txt.
      - name: X-01 origin-guard cells on Laravel
        working-directory: tests/parity
        run: node scripts/laravel-stack.mjs "@security&@api" --only "X-01 .* -> 403 INVALID_ORIGIN before auth "
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-laravel
          path: tests/parity/playwright-report
