server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 100m;
    # X-05 (story 1.5): keep nginx's defaults `underscores_in_headers off` / `ignore_invalid_headers on`.
    # FastCGI maps both `X-Real-IP` and `X_Real_IP` to HTTP_X_REAL_IP; dropping underscore names keeps
    # a client from smuggling a second spelling of a trusted header.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # X-05 / ADR-010 (story 1.5): in dev this nginx is the edge, so it does what Cloudflare does in
        # production: it OVERWRITES the client-address headers with the socket peer, whatever the
        # client sent (a fastcgi_param HTTP_* replaces the request header of that name). So
        # AUTH_CLIENT_IP_HEADER=cf-connecting-ip (or x-real-ip) and AUTH_TRUSTED_PROXY_HOPS=1 are all
        # safe here. Production (Forge, Epic 9): see the story 1.5 record, "Production nginx".
        fastcgi_param HTTP_CF_CONNECTING_IP $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
