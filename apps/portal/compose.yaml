# Local development stack for the Laravel portal (story 1.1a; architecture §4.6). Dev-only credentials.
#   docker compose up            → http://localhost:8080 (app), :5173 (Vite), :8025 (Mailpit)
# Ports bind to 127.0.0.1 and differ from the parity stack (tests/parity/infra), so both can run at once.
# Parallel copies (e.g. agent worktrees): set COMPOSE_PROJECT_NAME and the PORTAL_*_PORT variables.
name: lf-portal

x-php: &php
  build:
    context: docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: lf-portal-php:dev
  volumes:
    - .:/var/www/html

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_PASSWORD: dev-only-superuser
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${PORTAL_PG_PORT:-55532}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal_test"]
      interval: 2s
      timeout: 3s
      retries: 60

  init:
    <<: *php
    command: ["sh", "docker/php/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *php
    command: ["php-fpm"]
    depends_on:
      init:
        condition: service_completed_successfully

  web:
    image: nginx:1.28-alpine
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8080}:80"
    depends_on:
      - app

  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    depends_on:
      init:
        condition: service_completed_successfully

  vite:
    image: node:24-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: ["sh", "-c", "npm ci --no-fund --no-audit && npm run dev"]
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${PORTAL_VITE_PORT:-5173}:5173"

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:${PORTAL_MAIL_PORT:-8025}:8025"

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    environment:
      S3_ACCESS_KEY: dev-only-access-key
      S3_SECRET_KEY: dev-only-secret-key
      S3_BUCKETS: portal-concepts,portal-finals
    entrypoint: ["/bin/sh", "/start.sh"]
    volumes:
      - ./docker/seaweedfs/start.sh:/start.sh:ro
    ports:
      - "127.0.0.1:${PORTAL_S3_PORT:-8333}:8333"

volumes:
  pgdata:
