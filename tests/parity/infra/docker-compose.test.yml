# Parity test stack (story 0.2). Offline, identical infrastructure for both apps.
#
#   npm run infra:up      # docker compose ... up -d --wait
#   npm run infra:probe   # S3 conditional-PUT probe, postmark-shim -> Mailpit, stripe-fake selftest
#   npm run infra:down    # stops and removes containers and volumes
#
# TEST-ONLY VALUES: every password, key and secret in this file is a throwaway
# value for a local, disposable stack. None of them is used anywhere real. Never
# copy them into a deployed environment.
#
# Host ports default to a 55xxx/58xxx range so they don't collide with other
# local stacks; override with the PARITY_*_PORT variables.

name: lf-parity

x-test-only: &test-only
  # Shared throwaway credentials (TEST-ONLY).
  PARITY_PG_SUPERUSER_PASSWORD: &pg-super-pw parity-test-only-superuser
  PARITY_PG_RUNTIME_PASSWORD: &pg-runtime-pw parity-test-only-runtime
  PARITY_PG_MIGRATE_PASSWORD: &pg-migrate-pw parity-test-only-migrate
  PARITY_S3_ACCESS_KEY: &s3-access parity-test-only-access-key
  PARITY_S3_SECRET_KEY: &s3-secret parity-test-only-secret-key
  STRIPE_WEBHOOK_SECRET: &stripe-whsec whsec_parity_test_only_0000000000000000

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: *pg-super-pw
      POSTGRES_DB: lf_parity
      # Roles for the Laravel app (ADR-013): runtime DML and migrate/owner.
      PARITY_PG_RUNTIME_ROLE: lf_runtime
      PARITY_PG_RUNTIME_PASSWORD: *pg-runtime-pw
      PARITY_PG_MIGRATE_ROLE: lf_migrate
      PARITY_PG_MIGRATE_PASSWORD: *pg-migrate-pw
    ports:
      - "127.0.0.1:${PARITY_PG_PORT:-55432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql:size=512m
    healthcheck:
      # Healthy only once the init script has created the marker table.
      test: ["CMD-SHELL", "psql -U postgres -d lf_parity -tAc 'select 1 from parity.parity_marker limit 1' | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${PARITY_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${PARITY_MAILPIT_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    environment:
      PARITY_S3_ACCESS_KEY: *s3-access
      PARITY_S3_SECRET_KEY: *s3-secret
      PARITY_S3_CONCEPTS_BUCKET: ${PARITY_S3_CONCEPTS_BUCKET:-lf-parity-concepts}
      PARITY_S3_FINALS_BUCKET: ${PARITY_S3_FINALS_BUCKET:-lf-parity-final-deliverables}
    entrypoint: ["/bin/sh", "/parity/start.sh"]
    volumes:
      - ./seaweedfs/start.sh:/parity/start.sh:ro
    ports:
      - "127.0.0.1:${PARITY_S3_PORT:-58333}:8333"
    healthcheck:
      # Healthy only once both buckets exist (start.sh writes the marker).
      test: ["CMD-SHELL", "test -f /tmp/parity-buckets-ready"]
      interval: 2s
      timeout: 3s
      retries: 60

  postmark-shim:
    image: node:24.22.2-alpine3.23
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: 8080
      MAILPIT_URL: http://mailpit:8025
      # Optional: when set, X-Postmark-Server-Token must equal it (TEST-ONLY value).
      POSTMARK_SHIM_TOKEN: ${POSTMARK_SHIM_TOKEN:-}
    volumes:
      - ./postmark-shim:/app:ro
    ports:
      - "127.0.0.1:${PARITY_POSTMARK_PORT:-58090}:8080"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__health"]
      interval: 2s
      timeout: 3s
      retries: 30

  stripe-fake:
    image: node:24.22.2-alpine3.23
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: 12111
      FIXTURES_DIR: /fixtures
      # URL the browser uses for the fake hosted checkout page.
      STRIPE_FAKE_PUBLIC_URL: ${STRIPE_FAKE_PUBLIC_URL:-http://127.0.0.1:58091}
      # Where signed webhooks go. Default: the Next parity server on the host (port 4310).
      STRIPE_FAKE_WEBHOOK_URL: ${STRIPE_FAKE_WEBHOOK_URL:-http://host.docker.internal:4310/api/stripe/webhook}
      STRIPE_WEBHOOK_SECRET: *stripe-whsec
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./stripe-fake:/app:ro
      - ../fixtures/stripe:/fixtures:ro
    ports:
      - "127.0.0.1:${PARITY_STRIPE_PORT:-58091}:12111"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:12111/__health"]
      interval: 2s
      timeout: 3s
      retries: 30
